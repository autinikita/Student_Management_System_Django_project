<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Student Management System</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background: linear-gradient(120deg,#6a11cb,#2575fc);
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
        }
        .card{
            width:100%;
            max-width:500px;
            border-radius:15px;
            box-shadow:0 10px 25px rgba(0,0,0,0.2);
        }
        h3{
            text-align:center;
            font-weight:700;
        }
        .btn-custom{
            background:#2575fc;
            color:white;
            font-weight:600;
        }
        .btn-custom:hover{
            background:#1a5ed9;
        }
    </style>

</head>
<body>

<div class="card p-4">
    <h3 class="mb-4">Add Student</h3>

    <form method="post">
        {% csrf_token %}

        <!-- First Name -->
        <div class="form-floating mb-3">
            <input type="text" class="form-control" name="first_name" placeholder="First Name" required>
            <label>First Name</label>
        </div>

        <!-- Last Name -->
        <div class="form-floating mb-3">
            <input type="text" class="form-control" name="last_name" placeholder="Last Name" required>
            <label>Last Name</label>
        </div>

        <!-- Marks -->
        <div class="form-floating mb-3">
            <input type="number" class="form-control" name="marks" placeholder="Marks" required>
            <label>Marks</label>
        </div>

        <!-- Phone -->
        <div class="form-floating mb-3">
            <input type="number" class="form-control" name="phone" placeholder="Phone" required>
            <label>Phone</label>
        </div>

        <!-- Percentage -->
        <div class="form-floating mb-3">
            <input type="number" class="form-control" name="percentage" placeholder="Percentage" required>
            <label>Percentage</label>
        </div>

        <!-- Roll Number -->
        <div class="mb-3">
            <label class="form-label">Roll Number</label>
            <select class="form-select" name="roll_number" required>
                <option value="">Select Roll Number</option>
                {% for r in roll_numbers %}
                <option value="{{ r.id }}">{{ r.roll_no }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- Department -->
        <div class="mb-3">
            <label class="form-label">Department</label>
            <select class="form-select" name="dept" required>
                <option value="">Select Department</option>
                {% for d in departments %}
                <option value="{{ d.id }}">{{ d.name }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- Role -->
        <div class="mb-3">
            <label class="form-label">Role</label>
            <select class="form-select" name="role" required>
                <option value="">Select Role</option>
                {% for r in roles %}
                <option value="{{ r.id }}">{{ r.name }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- Grade -->
        <div class="mb-4">
            <label class="form-label">Grade</label>
            <select class="form-select" name="grade" required>
                <option value="">Select Grade</option>
                {% for g in grades %}
                <option value="{{ g.id }}">{{ g.name }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- Button -->
        <div class="d-grid">
            <button type="submit" class="btn btn-custom btn-lg">Add Student</button>
        </div>

    </form>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
