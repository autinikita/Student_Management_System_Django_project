<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Student Management System</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body{
            background: linear-gradient(120deg,#1d2671,#c33764);
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
        }

        .dashboard-card{
            background:white;
            padding:40px;
            border-radius:20px;
            box-shadow:0 10px 30px rgba(0,0,0,0.3);
            width:100%;
            max-width:650px;
            text-align:center;
        }

        .dashboard-card h1{
            font-weight:700;
            margin-bottom:10px;
        }

        .dashboard-card p{
            color:#666;
            margin-bottom:30px;
        }

        .btn-box{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
            gap:20px;
        }

        .btn-dashboard{
            padding:18px;
            font-size:18px;
            font-weight:600;
            border-radius:12px;
            color:white;
            transition:0.3s;
        }

        .btn-dashboard i{
            font-size:22px;
            margin-right:8px;
        }

        .add{background:#4CAF50;}
        .remove{background:#f44336;}
        .view{background:#2196F3;}
        .filter{background:#ff9800;}

        .btn-dashboard:hover{
            transform:scale(1.05);
            opacity:0.9;
        }
    </style>

</head>
<body>

<div class="dashboard-card">

    <h1>Student Management System</h1>
    <p>Manage student records easily</p>

    <div class="btn-box">

        <a href="/add" class="btn btn-dashboard add">
            <i class="bi bi-person-plus-fill"></i> Add Student
        </a>

        <a href="/Remove" class="btn btn-dashboard remove">
            <i class="bi bi-person-dash-fill"></i> Remove Student
        </a>

        <a href="/All_stu" class="btn btn-dashboard view">
            <i class="bi bi-people-fill"></i> View All Students
        </a>

        <a href="/update-student/" class="btn btn-dashboard filter">
            <i class="bi bi-funnel-fill"></i> Update Students
        </a>

    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
