<!DOCTYPE html>
<html>
<head>
    <title>Update Student</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow p-4">

        <h4 class="text-center mb-4">Update Student Information</h4>

        <!-- SELECT STUDENT -->
        <form method="GET" class="mb-4">
            <label class="form-label">Select Student</label>
            <select name="student_id" class="form-select" onchange="this.form.submit()">
                <option value="">-- Choose Student --</option>
                {% for s in students %}
                <option value="{{ s.id }}" {% if student and s.id == student.id %}selected{% endif %}>
                    {{ s.first_name }} {{ s.last_name }}
                </option>
                {% endfor %}
            </select>
        </form>
        <div class="card-footer text-center">
                    <a href="{% url 'index' %}" class="btn btn-secondary btn-sm">
                        <i class="bi bi-arrow-left"></i> Back to Dashboard

        {% if student %}
        <!-- UPDATE FORM -->
        <form method="POST">
            {% csrf_token %}
            <input type="hidden" name="student_id" value="{{ student.id }}">

            <div class="row mb-3">
                <div class="col">
                    <label>First Name</label>
                    <input type="text" name="first_name" value="{{ student.first_name }}" class="form-control">
                </div>
                <div class="col">
                    <label>Last Name</label>
                    <input type="text" name="last_name" value="{{ student.last_name }}" class="form-control">
                </div>
            </div>

            <div class="row mb-3">
                <div class="col">
                    <label>Phone</label>
                    <input type="text" name="phone" value="{{ student.phone }}" class="form-control">
                </div>
                <div class="col">
                    <label>Marks</label>
                    <input type="number" name="marks" value="{{ student.marks }}" class="form-control">
                </div>
            </div>

            <div class="mb-3">
                <label>Percentage</label>
                <input type="text" name="percentage" value="{{ student.percentage }}" class="form-control">
            </div>

            <div class="row mb-3">
                <div class="col">
                    <label>Department</label>
                    <select name="dept" class="form-select">
                        {% for d in departments %}
                        <option value="{{ d.id }}" {% if d == student.dept %}selected{% endif %}>{{ d.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="col">
                    <label>Role</label>
                    <select name="role" class="form-select">
                        {% for r in roles %}
                        <option value="{{ r.id }}" {% if r == student.role %}selected{% endif %}>{{ r.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col">
                    <label>Grade</label>
                    <select name="grade" class="form-select">
                        {% for g in grades %}
                        <option value="{{ g.id }}" {% if g == student.grade %}selected{% endif %}>{{ g.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="col">
                    <label>Roll Number</label>
                    <select name="roll_number" class="form-select">
                        {% for r in roll_numbers %}
                        <option value="{{ r.id }}" {% if r == student.roll_number %}selected{% endif %}>{{ r.roll_no }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="text-center">
                <button class="btn btn-success px-4">Update Student</button>
            </div>
        </form>
        {% endif %}

    </div>
</div>

</body>
</html>
