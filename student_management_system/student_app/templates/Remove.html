<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Remove Student</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
        }
        .card {
            border-radius: 12px;
        }
        .student-item:hover {
            background-color: #fff3f3;
        }
    </style>
</head>

<body>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card shadow">
                <div class="card-header bg-danger text-white text-center">
                    <h4 class="mb-0">
                        <i class="bi bi-trash-fill"></i> Remove Student
                    </h4>
                </div>

                <div class="card-body p-0">
                    {% if students %}
                        <ul class="list-group list-group-flush">
                            {% for student in students %}
                            <li class="list-group-item d-flex justify-content-between align-items-center student-item">
                                <span>
                                    <i class="bi bi-person-circle me-2"></i>
                                    {{ student.first_name }} {{ student.last_name }}
                                </span>

                                <a href="{% url 'delete_student' student.id %}"
                                   class="btn btn-sm btn-outline-danger"
                                   onclick="return confirm('Are you sure you want to delete this student?')">
                                    <i class="bi bi-trash"></i> Delete
                                </a>
                            </li>
                            {% endfor %}
                        </ul>
                    {% else %}
                        <div class="text-center p-4 text-muted">
                            <i class="bi bi-info-circle"></i> No students found
                        </div>
                    {% endif %}
                </div>

                <div class="card-footer text-center">
                    <a href="{% url 'index' %}" class="btn btn-secondary btn-sm">
                        <i class="bi bi-arrow-left"></i> Back to Dashboard
                    </a>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
